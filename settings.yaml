---
# cluster_name is used to group the nodes in a folder within VirtualBox:
cluster_name: Prometheus Cluster
environment: development
network:
  dns_servers:
    - 9.9.9.11
    - 1.1.1.1
  pod_cidr: 10.244.0.0/16
  service_cidr: 10.96.0.0/12
nodes:
  control:
    cpu: 4
    memory: 6144
  workers:
    count: 1
    cpu: 2
    memory: 4096
  ps:
    cpu: 4
    memory: 6144
  pc:
    cpu: 2
    memory: 4096
software:
  box: bento/ubuntu-24.04
  calico: 3.28.2
  dashboard: 
  kubernetes: v1.31
  os: xUbuntu_22.04
  crio: v1.31